spring.application.name=sca-fix-tool
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# Application startup and runtime logs
logging.file.name=${SCA_LOG_FILE:logs/sca-fix-tool.log}
logging.logback.rollingpolicy.max-file-size=${SCA_LOG_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${SCA_LOG_MAX_HISTORY:14}
logging.logback.rollingpolicy.total-size-cap=${SCA_LOG_TOTAL_SIZE_CAP:100MB}
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# H2 is the default runtime database. Override these properties to use PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sca-fix;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
sca.workspace.root=${SCA_WORKSPACE_ROOT:./work}
sca.reports.root=${SCA_REPORTS_ROOT:./data/reports}
sca.jobs.output-retention=${SCA_JOBS_OUTPUT_RETENTION:30d}
sca.maven.cache-ttl=${SCA_MAVEN_CACHE_TTL:1h}
sca.maven.connect-timeout=${SCA_MAVEN_CONNECT_TIMEOUT:10s}
sca.maven.read-timeout=${SCA_MAVEN_READ_TIMEOUT:15s}
sca.maven.unavailable-block-duration=${SCA_MAVEN_UNAVAILABLE_BLOCK_DURATION:10m}
sca.maven.effective-pom-root=${SCA_MAVEN_EFFECTIVE_POM_ROOT:./data/effective-poms}
sca.maven.dependency-plugin-version=${SCA_MAVEN_DEPENDENCY_PLUGIN_VERSION:3.8.1}
sca.maven.help-plugin-version=${SCA_MAVEN_HELP_PLUGIN_VERSION:3.5.2}
sca.maven.repositories[0].id=${SCA_MAVEN_REPOSITORY_ID:central}
sca.maven.repositories[0].url=${SCA_MAVEN_REPOSITORY_URL:https://repo1.maven.org/maven2}
sca.maven.repositories[0].username=${SCA_MAVEN_REPOSITORY_USERNAME:}
sca.maven.repositories[0].password=${SCA_MAVEN_REPOSITORY_PASSWORD:}
spring.servlet.multipart.max-file-size=${SCA_REPORT_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${SCA_REPORT_MAX_REQUEST_SIZE:110MB}
